# This is a list of preferences that will override the default preferences for the application.
# The format is:
# <pref name> = <pref value>
# To lock a preference (prevent users from changing it), add '@' prefix to the pref name:
# @<pref name> = <pref value>

# Example:
# browser.startup.homepage = "https://www.google.com"
# @browser.startup.homepage = "https://www.google.com"  (Locked)
# browser.startup.homepage_override = true
# browser.version = 100

intl.locale.requested = ""
app.feedback.baseURL = "https://docs.floorp.app/"
browser.toolbars.bookmarks.visibility = "never"
browser.startup.page = 3
# No post-update "we've changed some things, it's all still here / Got it"
# interruption. mstone=ignore stops the version-change what's-new/upgrade flow
# from firing, and the upgrade dialog is turned off outright.
browser.startup.homepage_override.mstone = "ignore"
browser.startup.upgradeDialog.enabled = false

services.sync.engine.prefs = true
services.sync.prefs.sync.browser.newtabpage.activity-stream.feeds.snippets = false
services.sync.prefs.sync.browser.newtabpage.activity-stream.showSponsored = false
services.sync.prefs.sync.browser.newtabpage.activity-stream.showSponsoredTopSites = false
services.sync.telemetry.maxPayloadCount = "0"
services.sync.telemetry.submissionInterval = "0"
services.sync.prefs.sync.browser.startup.page = false
services.sync.prefs.sync.browser.tabs.warnOnClose = false

svg.context-properties.content.enabled = true

toolkit.legacyUserProfileCustomizations.stylesheets = true
browser.preferences.moreFromMozilla = false

browser.tabs.warnOnClose = false
browser.tabs.warnOnCloseOtherTabs = false
extensions.getAddons.showPane = false
xpinstall.signatures.required = false

toolkit.telemetry.archive.enabled = false
toolkit.telemetry.bhrPing.enabled = false
toolkit.telemetry.enabled = false
toolkit.telemetry.firstShutdownPing.enabled = false
toolkit.telemetry.geckoview.streaming = false
toolkit.telemetry.newProfilePing.enabled = false
toolkit.telemetry.pioneer-new-studies-available = false
toolkit.telemetry.reportingpolicy.firstRun = false
toolkit.telemetry.server = ""
toolkit.telemetry.shutdownPingSender.enabled = false
toolkit.telemetry.shutdownPingSender.enabledFirstSession = false
toolkit.telemetry.testing.overrideProductsCheck = false
toolkit.telemetry.unified = false
toolkit.telemetry.updatePing.enabled = false
dom.private-attribution.submission.enabled = false

app.shield.optoutstudies.enabled = false

privacy.trackingprotection.origin_telemetry.enabled = false
privacy.userContext.enabled = true
privacy.userContext.ui.enabled = true
trailhead.firstrun.branches = ""
extensions.webcompat-reporter.enabled = false

devtools.toolbox.host = "right"

extensions.htmlaboutaddons.recommendations.enabled = false
datareporting.policy.dataSubmissionEnabled = false
datareporting.healthreport.uploadEnabled = false

browser.search.separatePrivateDefault = true
browser.search.separatePrivateDefault.ui.enabled = true
browser.urlbar.update2.engineAliasRefresh = true
# The results panel opened the moment the address bar was focused, before
# a single key was pressed — that is top sites being suggested on an empty
# input. Off, so the panel only appears once there is something to match.
browser.urlbar.suggest.topsites = false

browser.taskbarTabs.enabled = true
browser.profiles.forceEnableRefresh = true
browser.tabs.splitView.enabled = true
# bork: tab drags reorder tabs, nothing else (split view via menu only)
floorp.splitView.dragToSplitCreate.enabled = false

floorp.splitView.config = "{\"layout\":\"horizontal\",\"maxPanes\":4}"
floorp.splitView.paneSizes = "{\"flexRatios\":[0.5,0.5],\"gridColRatio\":0.5,\"gridRowRatio\":0.5}"

services.sync.prefs.sync.floorp.browser.note.memos = true

# bork defaults: no Firefox View button, no tab hover preview cards
browser.tabs.firefox-view = false
browser.tabs.hoverPreview.enabled = false
browser.tabs.hoverPreview.showThumbnails = false

# bork: address-bar hiding back on (2026-07-16, post vanish-fix)
bork.urlbar.autohide.enabled = true
# bork: sidebar show/hide shortcut back on (2026-07-16, post vanish-fix)
bork.sidebar.toggle.enabled = true
# bork: zen mode back on (2026-07-16) — first feature returned after the
# vanish fix (widget.macos.window-transforms.disabled). Zen's earlier
# retract-collapse reports may have been the same transform mechanism; if
# vanishing returns with zen on, switch this false again first.
bork.zen.enabled = true
# bork: tab stacks back on (2026-07-16) — second feature returned after the
# vanish fix; zen mode came back first and validated fine.
floorp.tabstacks.enabled = true
# bork: Dark Bork is the default look (black-swish strip + darkened chrome).
# bork-defaults reads this pref live and stamps data-bork-dark on the root.
bork.theme.dark.enabled = true


# bork: disable native macOS window transforms (the vanish-bug switch).
# Panels animate open via -moz-window-transform/-moz-window-opacity applied
# to their native window; our popup churn raced that machinery and windows
# were left composited as an empty frame (border + top strip, transparent
# body) until a drag/resize forced the window server to recompute. Panels
# simply pop open with this on. Set false to re-test the transform path.
widget.macos.window-transforms.disabled = true

# bork: elastic overscroll bounce restored (the fault-hunt era set it
# false; override.sh accumulates old lines in firefox.js, so an explicit
# true is needed rather than just removing the line).
apz.overscroll.enabled = true

# bork: compact toolbar density — the nav bar's 42px default is bulky for a
# compact browser. Lepton (our skin's base) has [uidensity="compact"]
# branches, so this shrinks the address bar and toolbar buttons via the
# design's own path. Tab strip is unaffected (pinned by --bork-tab-height).
browser.uidensity = 1

# bork: LibreWolf/Waterfox-style quiet set, Tier A (2026-07-17). All
# reversible only by explicit opposite values (override.sh accumulates).
# -- AI/ML inference off. Translation does NOT need it: TranslationsFeature
# gates on browser.translations.enable alone (isBlocked is literally
# !translationsEnabledPref), runs Bergamot rather than the ML runtime, and
# fetches its models from RemoteSettings, not the AI model hub. The
# "unblock this feature" message came from browser.translations.enable
# being off in the automation profile, not from this pref.
browser.ml.enable = false
browser.ml.chat.enabled = false
browser.ml.chat.shortcuts = false
browser.ml.chat.sidebar = false
# The "Ask an AI chatbot" context-menu item is NOT gated by chat.enabled. In
# GenAI.buildAskChatMenu the page feature shows when canShowChatEntrypoint OR
# isPageFeatureAllowed, and the latter is (chat.page && (provider || chat.menu)
# && …) — both chat.page and chat.menu default ON, so the item appeared despite
# chat.enabled=false. Turn the page feature and its menu entry off at the root.
browser.ml.chat.page = false
browser.ml.chat.menu = false
browser.ml.linkPreview.enabled = false
browser.ml.pageAssist.enabled = false
# Smart tab grouping (AI-suggested groups and AI-generated group names)
# ships ON and was only dormant because the runtime was off — enabling the
# runtime for translation would have quietly switched it on. It also
# collides with tab stacks, which name themselves.
browser.tabs.groups.smart.enabled = false
browser.tabs.groups.smart.userEnabled = false
browser.tabs.groups.smart.searchTopicEnabled = false
# -- No remote experiments / remote pref flipping
app.normandy.enabled = false
app.normandy.api_url = ""
# -- No Pocket
extensions.pocket.enabled = false
# -- No Firefox Suggest / Merino queries from the urlbar
browser.urlbar.quicksuggest.enabled = false
browser.urlbar.merino.enabled = false
browser.urlbar.suggest.quicksuggest.sponsored = false
browser.urlbar.suggest.quicksuggest.nonsponsored = false
# -- No automatic crash report submission
browser.tabs.crashReporting.sendReport = false
breakpad.reportURL = ""
# -- Safe-browsing STAYS ON; only Google data-sharing off
browser.safebrowsing.provider.google4.dataSharing.enabled = false

# bork: vertical tabs removed entirely (2026-07-21) — the horizontal strip is
# the only tab layout (tab stacks + theme assume it). Explicit false because
# override.sh accumulates. Runtime enforcement (user-value migration +
# lockPref every startup) lives in NoranekoStartup.sys.mts; do NOT use the
# @-lock syntax here, it is unimplemented and silently matches nothing.
sidebar.verticalTabs = false
