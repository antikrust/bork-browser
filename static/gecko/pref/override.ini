# This is a list of preferences that will override the default preferences for the application.
# The format is:
# <pref name> = <pref value>
# To lock a preference (prevent users from changing it), add '@' prefix to the pref name:
# @<pref name> = <pref value>

# Example:
# browser.startup.homepage = "https://www.google.com"
# @browser.startup.homepage = "https://www.google.com"  (Locked)
# browser.startup.homepage_override = true
# browser.version = 100

intl.locale.requested = ""
app.feedback.baseURL = "https://docs.floorp.app/"
browser.toolbars.bookmarks.visibility = "always"
browser.startup.page = 3

services.sync.engine.prefs = true
services.sync.prefs.sync.browser.newtabpage.activity-stream.feeds.snippets = false
services.sync.prefs.sync.browser.newtabpage.activity-stream.showSponsored = false
services.sync.prefs.sync.browser.newtabpage.activity-stream.showSponsoredTopSites = false
services.sync.telemetry.maxPayloadCount = "0"
services.sync.telemetry.submissionInterval = "0"
services.sync.prefs.sync.browser.startup.page = false
services.sync.prefs.sync.browser.tabs.warnOnClose = false

svg.context-properties.content.enabled = true

toolkit.legacyUserProfileCustomizations.stylesheets = true
browser.preferences.moreFromMozilla = false

browser.tabs.warnOnClose = false
browser.tabs.warnOnCloseOtherTabs = false
extensions.getAddons.showPane = false
xpinstall.signatures.required = false

toolkit.telemetry.archive.enabled = false
toolkit.telemetry.bhrPing.enabled = false
toolkit.telemetry.enabled = false
toolkit.telemetry.firstShutdownPing.enabled = false
toolkit.telemetry.geckoview.streaming = false
toolkit.telemetry.newProfilePing.enabled = false
toolkit.telemetry.pioneer-new-studies-available = false
toolkit.telemetry.reportingpolicy.firstRun = false
toolkit.telemetry.server = ""
toolkit.telemetry.shutdownPingSender.enabled = false
toolkit.telemetry.shutdownPingSender.enabledFirstSession = false
toolkit.telemetry.testing.overrideProductsCheck = false
toolkit.telemetry.unified = false
toolkit.telemetry.updatePing.enabled = false
dom.private-attribution.submission.enabled = false

app.shield.optoutstudies.enabled = false

privacy.trackingprotection.origin_telemetry.enabled = false
privacy.userContext.enabled = true
privacy.userContext.ui.enabled = true
trailhead.firstrun.branches = ""
extensions.webcompat-reporter.enabled = false

devtools.toolbox.host = "right"

extensions.htmlaboutaddons.recommendations.enabled = false
datareporting.policy.dataSubmissionEnabled = false
datareporting.healthreport.uploadEnabled = false

browser.search.separatePrivateDefault = true
browser.search.separatePrivateDefault.ui.enabled = true
browser.urlbar.update2.engineAliasRefresh = true

browser.taskbarTabs.enabled = true
browser.profiles.forceEnableRefresh = true
browser.tabs.splitView.enabled = true
# derp: tab drags reorder tabs, nothing else (split view via menu only)
floorp.splitView.dragToSplitCreate.enabled = false

floorp.splitView.config = "{\"layout\":\"horizontal\",\"maxPanes\":4}"
floorp.splitView.paneSizes = "{\"flexRatios\":[0.5,0.5],\"gridColRatio\":0.5,\"gridRowRatio\":0.5}"

floorp.os.enabled = false
floorp.os.hidden = true
floorp.mcp.enabled = false

services.sync.prefs.sync.floorp.browser.note.memos = true

# derp defaults: no Firefox View button, no tab hover preview cards
browser.tabs.firefox-view = false
browser.tabs.hoverPreview.enabled = false
browser.tabs.hoverPreview.showThumbnails = false

# derp: address-bar hiding back on (2026-07-16, post vanish-fix)
derp.urlbar.autohide.enabled = true
# derp: sidebar show/hide shortcut back on (2026-07-16, post vanish-fix)
derp.sidebar.toggle.enabled = true
# derp: zen mode back on (2026-07-16) — first feature returned after the
# vanish fix (widget.macos.window-transforms.disabled). Zen's earlier
# retract-collapse reports may have been the same transform mechanism; if
# vanishing returns with zen on, switch this false again first.
derp.zen.enabled = true
# derp: tab stacks back on (2026-07-16) — second feature returned after the
# vanish fix; zen mode came back first and validated fine.
floorp.tabstacks.enabled = true


# derp: disable native macOS window transforms (the vanish-bug switch).
# Panels animate open via -moz-window-transform/-moz-window-opacity applied
# to their native window; our popup churn raced that machinery and windows
# were left composited as an empty frame (border + top strip, transparent
# body) until a drag/resize forced the window server to recompute. Panels
# simply pop open with this on. Set false to re-test the transform path.
widget.macos.window-transforms.disabled = true

# derp: elastic overscroll bounce restored (the fault-hunt era set it
# false; override.sh accumulates old lines in firefox.js, so an explicit
# true is needed rather than just removing the line).
apz.overscroll.enabled = true
